<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Crossword Builder</h1>
        
        <div class="main-content">
            <div class="clues-container">
                <div class="clue-section">
                    <h3>Across</h3>
                    <div id="across-clues" class="clue-list"></div>
                </div>
                
                <div class="clue-section">
                    <h3>Down</h3>
                    <div id="down-clues" class="clue-list"></div>
                </div>
            </div>
            
            <div class="grid-container">
                <div id="crossword-grid"></div>
            </div>
            
            <div class="word-lists">
                <div class="word-section">
                    <h3>Answers</h3>
                    <div id="across-words" class="word-list"></div>
                </div>
                
                <div class="word-section">
                    <h3>Answers</h3>
                    <div id="down-words" class="word-list"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
