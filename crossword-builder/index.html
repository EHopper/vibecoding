<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Crossword Builder</h1>
                        <div class="grid-controls">
                    <label for="grid-size">Grid Size:</label>
                    <select id="grid-size">
                        <option value="5">5x5</option>
                        <option value="15">15x15</option>
                        <option value="21">21x21</option>
                        <option value="23">23x23</option>
                        <option value="25">25x25</option>
                    </select>
                </div>
        <div class="main-content">
            <div class="clues-pair-container">
                <div class="clue-section clue-section-tall">
                    <h3>Across</h3>
                    <div id="across-clues" class="clue-list"></div>
                </div>
                <div class="clue-section clue-section-tall">
                    <h3>Down</h3>
                    <div id="down-clues" class="clue-list"></div>
                </div>
            </div>
            <div class="grid-container">
                <div id="crossword-grid"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
